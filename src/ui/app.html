<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>考研智复习 · AI刷题助手</title>
<link rel="stylesheet" href="themes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg-body); color: var(--text-primary); min-height: 100vh; }
  .topbar {
    background: var(--brand-gradient); color: var(--text-on-brand);
    padding: 14px 24px; display: flex; align-items: center; gap: 20px;
    position: sticky; top: 0; z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .topbar .brand { font-size: 18px; font-weight: 700; }
  .topbar nav { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
  .topbar nav a {
    color: rgba(255,255,255,.85); text-decoration: none; font-size: 13.5px;
    padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .topbar nav a.active, .topbar nav a:hover { background: rgba(255,255,255,.18); color: var(--text-on-brand); }
  .topbar .status { font-size: 12.5px; opacity: .9; cursor: pointer; }
  .main { max-width: 860px; margin: 0 auto; padding: 24px 20px 60px; }
  .card { background: var(--bg-card); border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.05); border: 1px solid var(--border); }
  .card h2 { font-size: 16px; margin-bottom: 12px; }
  .q { margin-bottom: 16px; padding: 14px; border: 1px solid var(--border); border-radius: 10px; }
  .q .topic { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .q .content { font-size: 14.5px; line-height: 1.7; margin-bottom: 10px; }
  .opt { display: block; width: 100%; text-align: left; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; margin: 6px 0; font-size: 13.5px; cursor: pointer; }
  .opt:hover { border-color: var(--brand-primary); }
  .opt.selected { background: var(--info-bg); border-color: var(--brand-primary); }
  .opt.correct { background: var(--success-bg); border-color: var(--success); }
  .opt.wrong { background: var(--danger-bg); border-color: var(--danger); }
  .btn { display: inline-block; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: var(--brand-primary); color: var(--text-on-brand); }
  .btn-success { background: var(--success); color: var(--text-on-brand); }
  .btn-ghost { background: var(--bg-hover); color: var(--text-secondary); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .explain { margin-top: 10px; padding: 12px; background: var(--info-bg); border-radius: 8px; font-size: 13.5px; line-height: 1.7; white-space: pre-wrap; }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 0; font-size: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .metric { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
  .metric .num { font-size: 26px; font-weight: 700; color: var(--brand-dark); }
  .metric .label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: 13.5px; }
  .stat:last-child { border: none; }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
  .bar > div { height: 100%; background: var(--brand-primary); border-radius: 4px; }
  .tag { display: inline-block; background: var(--bg-hover); border-radius: 6px; padding: 3px 8px; font-size: 12px; margin: 3px; }
  .timer { font-size: 20px; font-weight: 700; color: var(--brand-dark); margin-bottom: 10px; }
  input[type=text], textarea, select { width: 100%; padding: 9px 12px; border: 1px solid var(--border-input); border-radius: 8px; font-size: 13.5px; font-family: inherit; }
  .row { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">🎓 考研智复习<div style="font-size:11px;font-weight:400;opacity:.8;margin-top:1px;"><a href="https://clawsjoy.com" target="_blank" rel="noopener" style="color:inherit;text-decoration:none;">clawsjoy.com</a></div></div>
  <nav id="nav">
    <a data-page="dashboard" class="active">📊 仪表盘</a>
    <a data-page="practice">✍️ 练习</a>
    <a data-page="exam">📝 模拟考试</a>
    <a data-page="errorbook">📕 错题本</a>
    <a data-page="library">📚 知识库</a>
    <a data-page="report">📈 报告</a>
  </nav>
  <div class="status" id="keyStatus">🔑 未配置</div>
</div>
<div class="main" id="main"></div>
<script type="module" src="app.js"></script>
</body>
</html>
