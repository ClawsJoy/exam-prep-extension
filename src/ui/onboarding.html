<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>欢迎使用 · 考研智复习</title>
<link rel="stylesheet" href="themes.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-dark) 50%, var(--brand-primary) 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-on-brand);
  }
  .card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 20px;
    padding: 48px 56px;
    max-width: 560px;
    text-align: center;
    box-shadow: 0 24px 64px rgba(0,0,0,0.35);
  }
  .emoji { font-size: 64px; }
  h1 { font-size: 30px; margin: 16px 0 8px; }
  .sub { font-size: 16px; opacity: 0.9; margin-bottom: 32px; }
  .points { text-align: left; margin: 24px 0 32px; }
  .point { display: flex; gap: 12px; margin: 14px 0; font-size: 15px; line-height: 1.6; }
  .point .icon { font-size: 20px; flex-shrink: 0; }
  .btn {
    display: inline-block;
    background: var(--bg-card);
    color: var(--brand-dark);
    border: none;
    border-radius: 12px;
    padding: 14px 40px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
    text-decoration: none;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .privacy { margin-top: 20px; font-size: 13px; opacity: 0.75; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🎓</div>
    <h1>欢迎使用 · 考研智复习</h1>
    <div class="sub">你的 AI 考研复习助手，已成功安装！</div>
    <div class="points">
      <div class="point"><span class="icon">🤖</span><span>让 AI 按章节出题、模拟考试、讲解错题，像私人老师一样陪你备考</span></div>
      <div class="point"><span class="icon">📕</span><span>错题自动进入遗忘曲线复习队列，科学安排复习节奏，不再遗漏</span></div>
      <div class="point"><span class="icon">🌐</span><span>网页一键抓取知识点、划词收藏错题，随时沉淀学习资料</span></div>
      <div class="point"><span class="icon">🔒</span><span>本地优先：学习数据、错题本只存在你的浏览器里，API Key 只在本地与 DeepSeek 之间传输，不经过任何第三方服务器</span></div>
    </div>
    <button class="btn" id="startBtn">🚀 开始使用</button>
    <div class="privacy">配置 DeepSeek API Key 后即可解锁全部 AI 功能</div>
    <div style="margin-top:20px;padding-top:14px;border-top:1px solid rgba(255,255,255,.25);font-size:12px;opacity:.7;">Powered by <a href="https://clawsjoy.com" target="_blank" rel="noopener" style="color:#fff;">ClawsJoy</a> · <a href="https://clawsjoy.com" target="_blank" rel="noopener" style="color:#fff;">clawsjoy.com</a></div>
  </div>
  <script type="module" src="onboarding.js"></script>
</body>
</html>
